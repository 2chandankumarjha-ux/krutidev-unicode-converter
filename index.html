<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kruti Dev ↔ Unicode Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #F59E0B;
            --secondary-hover: #D97706;
            --success: #10B981;
            --success-hover: #059669;
            --bg-color: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }

        .main-wrapper {
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .editor-container {
            display: flex;
            gap: 25px;
        }

        .box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.1rem;
            color: var(--text-main);
            background-color: var(--surface);
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            line-height: 1.6;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        textarea::placeholder {
            color: #9CA3AF;
        }

        /* Custom Scrollbar */
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-k2u {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-k2u:hover {
            box-shadow: 0 8px 15px rgba(118, 75, 162, 0.4);
            transform: translateY(-2px);
        }

        .btn-u2k {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .btn-u2k:hover {
            box-shadow: 0 8px 15px rgba(253, 160, 133, 0.4);
            transform: translateY(-2px);
        }

        .action-row {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        .btn-copy {
            background: var(--success);
            padding: 14px 40px;
            border-radius: 50px;
            display: none;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-copy:hover {
            background: var(--success-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        /* Footer CSS */
        .footer {
            width: 100%;
            text-align: center;
            padding: 25px 20px;
            margin-top: auto;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            border-top: 1px solid rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.5);
        }

        .footer span.heart {
            color: #ef4444;
            animation: beat 1s infinite alternate;
            display: inline-block;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .editor-container {
                flex-direction: column;
            }
            textarea {
                height: 180px;
            }
            .buttons {
                flex-direction: column;
            }
            .header h1 {
                font-size: 2rem;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header">
            <h1>🔄 Kruti Dev ↔ Unicode</h1>
            <p>Convert your Hindi text seamlessly between Kruti Dev and Unicode (Mangal).</p>
        </div>

        <div class="container">
            <div class="editor-container">
                <!-- Left Box: Input -->
                <div class="box">
                    <label>📝 Input Text</label>
                    <textarea id="inputText" placeholder="Yahan apna Kruti Dev ya Unicode text likhein ya paste karein..."></textarea>
                </div>

                <!-- Right Box: Output -->
                <div class="box">
                    <label>✨ Output Text</label>
                    <textarea id="outputText" placeholder="Converted text yahan aayega..." readonly></textarea>
                </div>
            </div>

            <div class="buttons">
                <button class="btn-k2u" onclick="convertText('k2u')">Kruti Dev ➡ Unicode</button>
                <button class="btn-u2k" onclick="convertText('u2k')">Unicode ➡ Kruti Dev</button>
            </div>
            
            <div class="action-row">
                <button class="btn-copy" id="copyBtn" onclick="copyText()">📋 Copy Output</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        Made with <span class="heart">❤️</span> by Chandan Kumar Jha
    </div>

    <!-- Load the logic -->
    <script src="converter.js"></script>
    <script>
        function convertText(direction) {
            const input = document.getElementById('inputText').value;
            const outputBox = document.getElementById('outputText');
            const copyBtn = document.getElementById('copyBtn');
            
            if (!input.trim()) {
                // Simple shake effect if empty
                document.getElementById('inputText').style.borderColor = "#ef4444";
                setTimeout(() => document.getElementById('inputText').style.borderColor = "", 1000);
                return;
            }

            let result = "";

            if (direction === 'k2u') {
                if (typeof krutiToUnicode === 'function') {
                    result = krutiToUnicode(input);
                } else {
                    alert("Converter logic not loaded. Check converter.js");
                    return;
                }
            } else {
                if (typeof unicodeToKruti === 'function') {
                    result = unicodeToKruti(input);
                } else {
                    alert("Converter logic not loaded. Check converter.js");
                    return;
                }
            }

            outputBox.value = result;
            copyBtn.style.display = "inline-block"; // Show copy button
        }

        function copyText() {
            const outputBox = document.getElementById('outputText');
            outputBox.select();
            document.execCommand("copy");
            
            const btn = document.getElementById('copyBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "✅ Copied!";
            btn.style.background = "#059669";
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = "";
            }, 2000);
        }
    </script>
</body>
</html>
